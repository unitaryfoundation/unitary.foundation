name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch's name
  push:
    branches: [main]
  pull_request:
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ vars.PUBLIC_CLOUDINARY_CLOUD_NAME }}
      PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ vars.PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6
      - name: Validate required public environment variables
        run: |
          test -n "$PUBLIC_CLOUDINARY_CLOUD_NAME" || {
            echo "PUBLIC_CLOUDINARY_CLOUD_NAME is not available to the build job"
            exit 1
          }
          test -n "$PUBLIC_CLOUDINARY_UPLOAD_PRESET" || {
            echo "PUBLIC_CLOUDINARY_UPLOAD_PRESET is not available to the build job"
            exit 1
          }
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 22
          package-manager: pnpm@10.33.2

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
